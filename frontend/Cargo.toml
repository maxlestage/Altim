[package]
name = "altim-web"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Altim : site de présentation et application web en Rust + Yew (WebAssembly)."

# The library (every screen), compiled once; one .wasm per part of the front comes from the entry points of
# frontend/bundles (package altim-bundles, see altim_web::part).
[lib]
crate-type = ["rlib"]

[dependencies]
altim-core = { path = "../core" }
# gloo 0.11 is the one Yew 0.23 and yew-router 0.20 depend on (0.12 would be a second copy in the wasm).
futures = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
gloo = { version = "0.11", default-features = false, features = ["timers", "events", "utils", "render"] }
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3.106"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
yew = { version = "0.23.0", features = ["csr"] }
yew-router = "0.20.0"

[dependencies.web-sys]
version = "0.3.106"
features = [
  "AbortController", "AbortSignal", "CanvasRenderingContext2d", "CanvasGradient", "Document", "DomRect", "DomTokenList", "Element",
  "CloseEvent", "EventSource", "Headers", "HtmlCanvasElement", "HtmlElement", "HtmlInputElement", "HtmlSelectElement",
  "IntersectionObserver", "IntersectionObserverEntry", "IntersectionObserverInit", "Location", "MediaQueryList",
  "MessageEvent", "Request", "RequestInit", "Response", "Storage", "Url", "UrlSearchParams", "Window",
  "VisibilityState", "History", "ScrollToOptions", "ScrollBehavior", "WebSocket",
]

[dev-dependencies]
wasm-bindgen-test = "0.3.79"

# Size of the browser build only (resolver 3: these features apply to wasm32 builds, never to the server):
# - chrono-tz keeps the zones named in CHRONO_TZ_TIMEZONE_FILTER (set by scripts/build-web.sh) instead of the whole
#   IANA database;
# - Yew's internal tracing events are compiled out.
[target.'cfg(target_arch = "wasm32")'.dependencies]
chrono-tz = { version = "0.10.4", features = ["filter-by-regex"] }
tracing = { version = "0.1.44", default-features = false, features = ["max_level_off", "release_max_level_off"] }

[lints.clippy]
collapsible_if = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
