name: iOS

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

jobs:
  kit-linux:
    name: Tests du noyau AltimKit (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - run: cd ios/AltimKit && swift test

  app:
    name: Build de l'app iOS + tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Tests du noyau AltimKit (macOS)
        run: cd ios/AltimKit && swift test
      - run: brew install xcodegen
      - name: Génération du projet Xcode
        run: |
          cd ios && xcodegen generate
          # The committed Altim.xcodeproj (for opening in Xcode) must follow project.yml.
          git diff --quiet -- . || { echo "::warning::ios/Altim.xcodeproj ou un Info.plist versionné diffère de project.yml : lancez « xcodegen generate » dans ios/ et commitez le résultat."; git diff --stat -- .; }
      - name: Compilation pour le simulateur iPhone
        run: |
          cd ios
          xcodebuild -project Altim.xcodeproj -scheme Altim -configuration Debug \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build > debug.log 2>&1 \
            || { grep -E "error:" debug.log | head -80; tail -30 debug.log; exit 1; }
          grep -E "warning: .*/Altim/" debug.log | sort -u | head -40 || true
          grep "BUILD SUCCEEDED" debug.log
      - name: Compilation Release (celle de TestFlight, sans signature)
        run: |
          cd ios
          xcodebuild -project Altim.xcodeproj -scheme Altim -configuration Release -derivedDataPath build \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build > release.log 2>&1 \
            || { grep -E "error:" release.log | head -80; tail -30 release.log; exit 1; }
          grep "BUILD SUCCEEDED" release.log
      - name: L'app contient bien la Live Activity et l'app Apple Watch
        run: |
          APP=ios/build/Build/Products/Release-iphoneos/Altim.app
          test -d "$APP/PlugIns/AltimWidgets.appex" || { echo "::error::Extension Live Activity absente"; exit 1; }
          test -d "$APP/Watch/AltimWatch.app" || { echo "::error::App Apple Watch absente"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :NSSupportsLiveActivities" "$APP/Info.plist" | grep -q true
          /usr/libexec/PlistBuddy -c "Print :BGTaskSchedulerPermittedIdentifiers:0" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" "$APP/PlugIns/AltimWidgets.appex/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :WKCompanionAppBundleIdentifier" "$APP/Watch/AltimWatch.app/Info.plist"
          lipo -info "$APP/Watch/AltimWatch.app/AltimWatch"
          echo "### ✅ Altim.app : extension Live Activity + app Apple Watch intégrées" >> "$GITHUB_STEP_SUMMARY"
