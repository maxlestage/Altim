name: iOS

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  core-linux:
    name: Tests du moteur (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - run: cd ios/AltimCore && swift test

  app:
    name: Build de l'app iOS + tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Tests du moteur (CryptoKit)
        run: cd ios/AltimCore && swift test
      - run: brew install xcodegen
      - name: Génération du projet Xcode
        run: cd ios && xcodegen generate
      - name: Compilation pour le simulateur iPhone
        run: |
          cd ios
          xcodebuild -project Altim.xcodeproj -scheme Altim -configuration Debug \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -40
          exit ${PIPESTATUS[0]}
