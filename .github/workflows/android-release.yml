# APK signé à installer sur un téléphone Android : lancez ce workflow depuis l'onglet Actions (même sur téléphone).
# Prérequis (voir DEPLOIEMENT.md) : secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
# ANDROID_KEY_PASSWORD. La même clé doit servir à chaque version, sinon Android refuse la mise à jour.
name: Android APK signé

on:
  workflow_dispatch:

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Clé de signature
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "::error::Secrets de signature Android manquants (voir DEPLOIEMENT.md)."; exit 1; fi
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/altim.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/altim.jks" >> "$GITHUB_ENV"
      - name: APK Release signé
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          ./gradlew :app:assembleRelease --console=plain
          "$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | head -3
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Altim.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Altim-apk
          path: ${{ runner.temp }}/Altim.apk
      - run: echo "### ✅ APK signé prêt : onglet Summary → Artifacts → Altim-apk" >> "$GITHUB_STEP_SUMMARY"
