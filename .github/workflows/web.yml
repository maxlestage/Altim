name: Web

on:
  push:
    paths: ["web/**", "frontend/**", "core/**", "Cargo.toml", "Cargo.lock", "scripts/build-web.sh", "scripts/web-tools.sh", "scripts/precompress/**", "backend/src/app/web.rs", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "frontend/**", "core/**", "Cargo.toml", "Cargo.lock", "scripts/build-web.sh", "scripts/web-tools.sh", "scripts/precompress/**", "backend/src/app/web.rs", ".github/workflows/web.yml"]

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

jobs:
  # The web front in Rust + Yew (frontend/) and the logic it shares with the server (core/), built for the browser.
  yew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: cargo fmt --all --check
      # The library and the entry point of each part of the front (frontend/bundles: site, groups of app screens, whole app).
      - run: cargo clippy -p altim-core -p altim-web -p altim-bundles --target wasm32-unknown-unknown --lib --examples --locked -- -D warnings
      - run: cargo clippy -p altim-core -p altim-web -p altim-bundles --all-targets --locked -- -D warnings
      - run: cargo test -p altim-core -p altim-web --locked
      - run: sh scripts/web-tools.sh
      # web/dist: the site's page and .wasm, one page (web/dist/app) and .wasm per group of app screens, the whole app's
      # .wasm, their brotli and gzip copies; sizes in the log.
      - run: sh scripts/build-web.sh
      - name: Pages servies, types et CSP
        run: |
          cargo build --locked -p altim --bin altim
          ALTIM_DEV_OPEN=1 PORT=3000 ALTIM_WEB_ROOT=$PWD/web ./target/debug/altim > run.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS localhost:3000/health && break; sleep 1; done
          curl -fsS localhost:3000/ | grep -q '<script type="module" src="/main-site-'
          curl -fsS localhost:3000/risques | grep -q '<script type="module" src="/main-site-'
          curl -fsS localhost:3000/app | grep -q '<script type="module" src="/main-app-radar-'
          curl -fsS localhost:3000/app/inconnu | grep -q '<script type="module" src="/main-app-radar-'
          curl -fsS localhost:3000/app/actif/crypto/BTC | grep -q '<script type="module" src="/main-app-actif-'
          curl -fsS localhost:3000/app/reglages | grep -q '<script type="module" src="/main-app-reglages-'
          curl -fsS localhost:3000/app/journal | grep -q '<script type="module" src="/main-app-avoirs-'
          curl -fsS localhost:3000/app/bot | grep -q '<script type="module" src="/main-app-bot-'
          # Each app page holds the app's frame (its tab lit) and the script that hides it before the disclaimer; the
          # site's page neither.
          curl -fsS localhost:3000/app/journal | grep -q '<div class="webapp" data-static="">.*<a href="/app/avoirs" aria-current="page" class="on">Mes avoirs</a>'
          curl -fsS localhost:3000/app/bot | grep -q '<script src="/gate-[0-9a-f]*\.js"></script><div id="root"><div class="webapp" data-static="">'
          ! curl -fsS localhost:3000/ | grep -q 'data-static'
          # Each app page's loader prepares the whole app (in-place moves to the other groups' screens).
          main=$(curl -fsS localhost:3000/app/reglages | grep -o 'src="/main-app-reglages-[0-9a-f]*\.js"' | cut -d'"' -f2)
          curl -fsS "localhost:3000$main" | grep -Eq '"/altim-app-[0-9a-f]{16}_bg\.wasm"'
          # Each .wasm: its type, and its precompressed brotli copy (gzip for a browser without brotli).
          for f in $(cd web/dist && ls altim-*_bg.wasm); do
            curl -fsSI "localhost:3000/$f" | grep -qi "content-type: application/wasm"
            curl -fsSI -H "Accept-Encoding: gzip, deflate, br, zstd" "localhost:3000/$f" > h.txt
            grep -qi "content-encoding: br" h.txt && grep -qi "content-type: application/wasm" h.txt && grep -qi "vary: accept-encoding" h.txt
            grep -qi "cache-control: private, max-age=31536000, immutable" h.txt
            test "$(curl -fsS -H "Accept-Encoding: br" "localhost:3000/$f" | wc -c)" = "$(wc -c < "web/dist/$f.br")"
            curl -fsSI -H "Accept-Encoding: gzip" "localhost:3000/$f" | grep -qi "content-encoding: gzip"
          done
          curl -fsSI localhost:3000/logo.svg | grep -qi "content-type: image/svg+xml"
          curl -fsSI localhost:3000/apple-touch-icon.png | grep -qi "content-type: image/png"
          curl -fsSI localhost:3000/ | grep -qi "script-src 'self' 'wasm-unsafe-eval'"
      - if: failure()
        run: cat run.log || true
