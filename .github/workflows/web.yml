name: Web

on:
  push:
    paths: ["web/**", "frontend/**", "core/**", "Cargo.toml", "Cargo.lock", "scripts/build-web.sh", "scripts/web-tools.sh", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "frontend/**", "core/**", "Cargo.toml", "Cargo.lock", "scripts/build-web.sh", "scripts/web-tools.sh", ".github/workflows/web.yml"]

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

jobs:
  # The web front in Rust + Yew (frontend/) and the logic it shares with the server (core/), built for the browser.
  yew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: cargo fmt --all --check
      - run: cargo clippy -p altim-core -p altim-web --target wasm32-unknown-unknown --locked -- -D warnings
      # Each half of the front alone (the release build makes one .wasm for the site, one for the app).
      - run: cargo clippy -p altim-web --target wasm32-unknown-unknown --locked --no-default-features --features site -- -D warnings
      - run: cargo clippy -p altim-web --target wasm32-unknown-unknown --locked --no-default-features --features app -- -D warnings
      - run: cargo clippy -p altim-core -p altim-web --all-targets --locked -- -D warnings
      - run: cargo test -p altim-core -p altim-web --locked
      - run: sh scripts/web-tools.sh
      # web/dist: the site's page and .wasm, the app's page (web/dist/app) and .wasm; sizes in the log.
      - run: sh scripts/build-web.sh
      - name: Pages servies, types et CSP
        run: |
          cargo build --locked -p altim --bin altim
          ALTIM_DEV_OPEN=1 PORT=3000 ALTIM_WEB_ROOT=$PWD/web ./target/debug/altim > run.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS localhost:3000/health && break; sleep 1; done
          curl -fsS localhost:3000/ | grep -q '<script type="module" src="/main-site-'
          curl -fsS localhost:3000/risques | grep -q '<script type="module" src="/main-site-'
          curl -fsS localhost:3000/app | grep -q '<script type="module" src="/main-app-'
          curl -fsS localhost:3000/app/actif/crypto/BTC | grep -q '<script type="module" src="/main-app-'
          for f in $(cd web/dist && ls altim-*_bg.wasm); do curl -fsSI "localhost:3000/$f" | grep -qi "content-type: application/wasm"; done
          curl -fsSI localhost:3000/logo.svg | grep -qi "content-type: image/svg+xml"
          curl -fsSI localhost:3000/apple-touch-icon.png | grep -qi "content-type: image/png"
          curl -fsSI localhost:3000/ | grep -qi "script-src 'self' 'wasm-unsafe-eval'"
      - if: failure()
        run: cat run.log || true
