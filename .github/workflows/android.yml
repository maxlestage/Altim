name: Android

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

jobs:
  build:
    name: Tests du noyau, lint, builds Debug et Release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests du noyau Kotlin (décodage des vraies réponses, SSE, formats, portefeuille)
        run: ./gradlew :kit:test --console=plain
      - name: Lint Android
        run: ./gradlew :app:lintDebug --console=plain
      - name: Build Debug (APK installable) et Release (minifié R8)
        run: ./gradlew :app:assembleDebug :app:assembleRelease --console=plain
      - name: APK de test à télécharger
        uses: actions/upload-artifact@v4
        with:
          name: altim-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
