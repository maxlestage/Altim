# Envoi sur TestFlight sans Mac : lancez ce workflow depuis l'onglet Actions de GitHub (même sur iPhone).
# Prérequis (voir DEPLOIEMENT.md) : compte Apple Developer, secrets APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID,
# ASC_KEY_P8 (contenu du fichier .p8). Premier lancement : le workflow enregistre lui-même les identifiants de lot
# (com.maxlestage.altim, .widgets, .watchkitapp) ; s'il n'y a pas encore d'app dans App Store Connect, il s'arrête en le
# disant : créez alors l'app avec l'identifiant com.maxlestage.altim (il apparaît maintenant dans la liste) et relancez.
name: TestFlight

on:
  workflow_dispatch:

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

jobs:
  upload:
    runs-on: macos-15
    env:
      TEAM: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      # App Store Connect only accepts apps built with the iOS 26 SDK or later (Xcode 26+): pick the newest Xcode
      # of the runner image, and stop with a clear message when there is none.
      - name: Xcode 26 ou plus récent
        run: |
          XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -E 'Xcode_(2[6-9]|[3-9][0-9])' | grep -v -i beta | sort -V | tail -1)
          [ -z "$XC" ] && XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -E 'Xcode_(2[6-9]|[3-9][0-9])' | sort -V | tail -1)
          if [ -z "$XC" ]; then echo "::error::Aucun Xcode 26 sur ce runner ($(ls -d /Applications/Xcode_*.app | xargs -n1 basename | tr '\n' ' '))."; exit 1; fi
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
      - name: Clé App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$TEAM" ] || [ -z "$KEY_ID" ] || [ -z "$ISSUER" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::error::Secrets Apple manquants (voir DEPLOIEMENT.md)."; exit 1
          fi
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
      - name: Identifiants de lot et app dans App Store Connect
        run: |
          python3 -m pip install --quiet --break-system-packages 'pyjwt[crypto]' 2>/dev/null || python3 -m pip install --quiet 'pyjwt[crypto]'
          python3 - <<'PY'
          import json, os, sys, time, urllib.error, urllib.request
          import jwt
          key = open(os.path.join(os.environ["RUNNER_TEMP"], "AuthKey.p8")).read()
          token = jwt.encode({"iss": os.environ["ISSUER"], "iat": int(time.time()), "exp": int(time.time()) + 1200,
                              "aud": "appstoreconnect-v1"}, key, algorithm="ES256", headers={"kid": os.environ["KEY_ID"]})
          def call(method, path, body=None):
              req = urllib.request.Request("https://api.appstoreconnect.apple.com" + path, method=method,
                                           data=json.dumps(body).encode() if body else None,
                                           headers={"Authorization": "Bearer " + token, "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req) as r:
                      return r.status, json.load(r)
              except urllib.error.HTTPError as e:
                  return e.code, json.loads(e.read() or b"{}")
          ids = {"com.maxlestage.altim": "Altim", "com.maxlestage.altim.widgets": "Altim Widgets",
                 "com.maxlestage.altim.watchkitapp": "Altim Watch"}
          for ident, name in ids.items():
              status, body = call("GET", "/v1/bundleIds?filter[identifier]=" + ident)
              if status != 200:
                  print(f"::error::App Store Connect refuse la clé ({status}) : vérifiez ASC_KEY_ID, ASC_ISSUER_ID et ASC_KEY_P8.")
                  print(json.dumps(body)[:500]); sys.exit(1)
              if any(d["attributes"]["identifier"] == ident for d in body.get("data", [])):
                  print(f"{ident} : déjà enregistré"); continue
              status, body = call("POST", "/v1/bundleIds", {"data": {"type": "bundleIds", "attributes":
                                   {"identifier": ident, "name": name, "platform": "IOS"}}})
              print(f"{ident} : {'enregistré' if status == 201 else 'échec ' + str(status) + ' ' + json.dumps(body)[:300]}")
              if status != 201: sys.exit(1)
          status, body = call("GET", "/v1/apps?filter[bundleId]=com.maxlestage.altim")
          if status != 200 or not body.get("data"):
              msg = ("Identifiants enregistrés. Il reste à créer l'app (une seule fois) : App Store Connect → Apps → + → Nouvelle app, "
                     "plateforme iOS, nom Altim, identifiant de lot com.maxlestage.altim, puis relancez ce workflow.")
              print("::error::" + msg)
              open(os.environ["GITHUB_STEP_SUMMARY"], "a").write("### ⏸ " + msg + "\n")
              sys.exit(1)
          print("App trouvée dans App Store Connect.")
          PY
      - name: Archive signée
        run: |
          cd ios && xcodegen generate
          xcodebuild -project Altim.xcodeproj -scheme Altim -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Altim.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" \
            archive | tail -40
          exit ${PIPESTATUS[0]}
      - name: Export et envoi vers TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Altim.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER"
          echo "### ✅ Build envoyé sur TestFlight (traitement Apple : ~15 min)" >> "$GITHUB_STEP_SUMMARY"
