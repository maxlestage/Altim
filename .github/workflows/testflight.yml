# Envoi sur TestFlight sans Mac : lancez ce workflow depuis l'onglet Actions de GitHub (même sur iPhone).
# Prérequis (voir DEPLOIEMENT.md) : compte Apple Developer, app créée dans App Store Connect,
# secrets APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (contenu du fichier .p8).
name: TestFlight

on:
  workflow_dispatch:

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

jobs:
  upload:
    runs-on: macos-15
    env:
      TEAM: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Clé App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$TEAM" ] || [ -z "$KEY_ID" ] || [ -z "$ISSUER" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::error::Secrets Apple manquants (voir DEPLOIEMENT.md)."; exit 1
          fi
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
      - name: Archive signée
        run: |
          cd ios && xcodegen generate
          xcodebuild -project Altim.xcodeproj -scheme Altim -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Altim.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" \
            archive | tail -40
          exit ${PIPESTATUS[0]}
      - name: Export et envoi vers TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Altim.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER"
          echo "### ✅ Build envoyé sur TestFlight (traitement Apple : ~15 min)" >> "$GITHUB_STEP_SUMMARY"
