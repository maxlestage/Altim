# Checks every day that each data source still responds in the expected format.
# In case of failure, GitHub sends an email: a source that changed its API is detected before it causes a bad signal.
name: Santé des sources

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Toutes les sources, toutes les unités de temps, cours, flux temps réel, séries macro (données réelles)
        run: cd backend && cargo test --locked --test sources_live -- --ignored --nocapture
