# Checks every day that each data source still responds in the expected format.
# In case of failure, GitHub sends an email: a source that changed its API is detected before it causes a bad signal.
name: Santé des sources

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Toutes les sources, toutes les unités de temps, flux temps réel (données réelles)
        run: cd web && ALTIM_LIVE=1 bun test test/sources-live.test.ts
