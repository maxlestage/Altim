name: Serveur (Rust)

on:
  push:
    paths: ["backend/**", "web/**", "Procfile", "RustConfig", "app.json", "package.json", "bun.lock", ".bun-version", "scripts/**", "Dockerfile", "heroku.yml", ".dockerignore", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "web/**", "Procfile", "RustConfig", "app.json", "package.json", "bun.lock", ".bun-version", "scripts/**", "Dockerfile", "heroku.yml", ".dockerignore", ".github/workflows/backend.yml"]

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # Unit tests + parity with the TypeScript engines (golden files) + route tests. Network tests are #[ignore].
      - run: cargo test --locked

  heroku:
    name: Build façon Heroku (buildpacks Bun puis Rust) et démarrage
    # heroku-24 is Ubuntu 24.04: the same buildpack scripts, in the same order, on the same system.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Buildpacks (scripts officiels, comme sur Heroku)
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/heroku"; mkdir -p "$W"/{build,cache-bun,cache-rust,env,home}
          git clone -q --depth 1 https://github.com/jakeg/heroku-buildpack-bun "$W/bp-bun"
          git clone -q --depth 1 https://github.com/emk/heroku-buildpack-rust "$W/bp-rust"
          git archive HEAD | tar -x -C "$W/build"
          HOME="$W/home" bash "$W/bp-bun/bin/compile" "$W/build" "$W/cache-bun" "$W/env"
          env -u CARGO_HOME -u RUSTUP_HOME bash "$W/bp-rust/bin/compile" "$W/build" "$W/cache-rust" "$W/env"
          echo "BUILD=$W/build" >> "$GITHUB_ENV"
      - name: Phase de publication (release) du Procfile
        run: |
          cd "$BUILD" && bash -c "$(sed -n 's/^release: //p' Procfile)"
      - name: Démarrage avec le Procfile, site et garde-fous des routes
        run: |
          cd "$BUILD"
          CMD=$(sed -n 's/^web: //p' Procfile | sed "s#/app/web#$BUILD/web#")
          PORT=3000 bash -c "$CMD" > dev.log 2>&1 &
          PORT=3001 DYNO=web.1 bash -c "$CMD" > prod.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS localhost:3000/health && curl -fsS localhost:3001/health && break; sleep 1; done
          curl -fsS localhost:3000/ | grep -q "<div id=\"root\">"
          curl -fsS localhost:3000/mentions-legales | grep -q "<div id=\"root\">"
          curl -fsS localhost:3000/app/actif/crypto/BTC | grep -q 'src="/index-'
          test "$(curl -sS localhost:3000/app/index-inexistant.js -o /dev/null -w '%{http_code}')" = "404"
          test "$(curl -sS 'localhost:3000/api/candles?base=../x&interval=1h' -o /dev/null -w '%{http_code}')" = "400"
          curl -fsSI localhost:3000/ | grep -qi "content-security-policy"
          # Production without configuration (DYNO set, as on Heroku): everything is closed.
          test "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' localhost:3001/app/reglages)" = "302 http://localhost:3001/login?next=%2Fapp%2Freglages"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3001/api/tickers)" = "401"
          curl -fsS localhost:3001/login | grep -q "Accès privé non configuré"
      - if: failure()
        run: cat "$BUILD"/dev.log "$BUILD"/prod.log || true

  heroku-auto:
    name: "Build façon Heroku sans buildpack réglé (détection Node.js) et démarrage"
    # An app connected to GitHub without buildpacks set: Heroku detects Node.js from package.json and runs
    # "heroku-postbuild" (scripts/heroku-build.sh), which builds the site and compiles the server itself.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Buildpack Node.js officiel seul
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/heroku"; mkdir -p "$W"/{build,cache,env,home}
          git clone -q --depth 1 https://github.com/heroku/heroku-buildpack-nodejs "$W/bp"
          git archive HEAD | tar -x -C "$W/build"
          bash "$W/bp/bin/detect" "$W/build"
          (cd "$W/build" && env -u CARGO_HOME -u RUSTUP_HOME HOME="$W/home" STACK=heroku-24 bash "$W/bp/bin/compile" "$W/build" "$W/cache" "$W/env")
          echo "BUILD=$W/build" >> "$GITHUB_ENV"
      - name: Phase de publication et démarrage
        run: |
          cd "$BUILD"
          bash -c "$(sed -n 's/^release: //p' Procfile)"
          CMD=$(sed -n 's/^web: //p' Procfile | sed "s#/app/web#$BUILD/web#")
          PORT=3000 bash -c "$CMD" > run.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS localhost:3000/health && break; sleep 1; done
          curl -fsS localhost:3000/ | grep -q "<div id=\"root\">"
      - if: failure()
        run: cat "$BUILD"/run.log || true

  docker:
    name: "Image Docker (app Heroku sur la pile container, heroku.yml) et démarrage"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construction de l'image
        run: docker build -t altim .
      - name: Démarrage sur $PORT comme Heroku
        run: |
          docker run -d --name altim -e PORT=5000 -p 5000:5000 altim
          for i in $(seq 1 30); do curl -fsS localhost:5000/health && break; sleep 1; done
          curl -fsS localhost:5000/ | grep -q "<div id=\"root\">"
      - if: failure()
        run: docker logs altim || true
