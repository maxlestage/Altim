name: Serveur (Rust)

on:
  push:
    paths: ["backend/**", "web/**", "Dockerfile", ".dockerignore", "heroku.yml", "package.json", "bun.lock", ".bun-version", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "web/**", "Dockerfile", ".dockerignore", "heroku.yml", "package.json", "bun.lock", ".bun-version", ".github/workflows/backend.yml"]

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # Unit tests + parity with the TypeScript engines (golden files) + route tests. Network tests are #[ignore].
      - run: cargo test --locked

  image:
    name: Image Heroku (Dockerfile) et démarrage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t altim .
      - name: Site et garde-fous des routes (sans accès privé, hors production)
        run: |
          docker run -d --name dev -p 3000:3000 -e PORT=3000 altim
          for i in $(seq 1 30); do curl -fsS localhost:3000/health && break; sleep 1; done
          curl -fsS localhost:3000/ | grep -q "<div id=\"root\">"
          curl -fsS localhost:3000/mentions-legales | grep -q "<div id=\"root\">"
          curl -fsS localhost:3000/app | grep -q "<div id=\"root\">"
          curl -fsS localhost:3000/app/actif/crypto/BTC | grep -q 'src="/index-'
          test "$(curl -sS localhost:3000/app/index-inexistant.js -o /dev/null -w '%{http_code}')" = "404"
          test "$(curl -sS 'localhost:3000/api/candles?base=../x&interval=1h' -o /dev/null -w '%{http_code}')" = "400"
          curl -fsSI localhost:3000/ | grep -qi "content-security-policy"
      - name: Production sans configuration : tout est fermé (comme sur Heroku, DYNO est défini)
        run: |
          docker run -d --name prod -p 3001:3001 -e PORT=3001 -e DYNO=web.1 altim
          for i in $(seq 1 30); do curl -fsS localhost:3001/health && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' localhost:3001/app/reglages)" = "302 http://localhost:3001/login?next=%2Fapp%2Freglages"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3001/api/tickers)" = "401"
          curl -fsS localhost:3001/login | grep -q "Accès privé non configuré"
      - if: failure()
        run: docker logs dev; docker logs prod
