# Altim: the server (backend/), the logic shared by the server and the browser (core/, also built for wasm32) and the
# web front in Rust + Yew (frontend/, built for wasm32 by scripts/build-web.sh).
[workspace]
resolver = "3"
members = ["backend", "core", "frontend", "frontend/bundles"]
default-members = ["backend", "core"]

[workspace.package]
edition = "2024"
rust-version = "1.94"
publish = false

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# The browser build (scripts/build-web.sh): smallest wasm, then wasm-opt when available.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
