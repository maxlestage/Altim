[package]
name = "altim"
version = "1.0.0"
edition = "2024"
rust-version = "1.94"
publish = false
description = "Serveur Altim : conseils de trading (aucun ordre passé), Axum."

[dependencies]
argon2 = "0.6.0"
async-stream = "0.3.6"
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.23.1"
bytes = "1.12.1"
chrono = "0.4.45"
chrono-tz = "0.10.4"
futures = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
indexmap = { version = "2", features = ["serde"] }
percent-encoding = "2.3.2"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "gzip", "brotli", "deflate", "http2", "charset"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.11.0"
subtle = "2.6.1"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs", "compression-full", "set-header", "timeout"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[lints.clippy]
# Nested `if let` read closer to the TypeScript they port.
collapsible_if = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
