# Projet Xcode généré par XcodeGen : `xcodegen generate` (fait automatiquement par la CI GitHub).
name: Altim
options:
  bundleIdPrefix: com.maxlestage
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fr
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  AltimCore:
    path: AltimCore
targets:
  Altim:
    type: application
    platform: iOS
    sources:
      - path: Altim
    dependencies:
      - package: AltimCore
    info:
      path: Altim/Info.plist
      properties:
        CFBundleDisplayName: Altim
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: fr
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: AccentColor
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maxlestage.altim
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
schemes:
  Altim:
    build:
      targets:
        Altim: all
    test:
      config: Debug
